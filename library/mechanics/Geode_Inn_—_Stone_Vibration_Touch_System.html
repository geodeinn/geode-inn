<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geode Inn — Stone Vibration Touch System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    background: #0a0805;
    color: #c9a84c;
    font-family: Georgia, 'Times New Roman', serif;
    overflow-x: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  
  /* Geode Inn aesthetic */
  :root {
    --bg: #0a0805;
    --gold: #c9a84c;
    --gold-dim: #8a7430;
    --gold-dark: #4a4030;
    --surface: #15110a;
    --surface-light: #1f1a12;
    --border: #2a2218;
  }
  
  /* Header */
  .header {
    text-align: center;
    padding: 20px 15px 10px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(to bottom, var(--surface), transparent);
  }
  .header h1 {
    font-size: 1.4em;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 5px;
  }
  .header .subtitle {
    font-size: 0.75em;
    color: var(--gold-dim);
    font-style: italic;
  }
  
  /* Touch sensory toggle */
  .sensory-toggle {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px 15px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 0.8em;
  }
  .toggle-label {
    color: var(--gold-dim);
    font-style: italic;
  }
  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.3s;
  }
  .toggle-switch.active {
    background: var(--gold-dim);
  }
  .toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: var(--gold);
    border-radius: 50%;
    transition: left 0.3s;
  }
  .toggle-switch.active .toggle-knob {
    left: 22px;
  }
  .toggle-status {
    font-size: 0.75em;
    color: var(--gold-dim);
    min-width: 80px;
  }
  
  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 5px;
    padding: 10px 12px;
    overflow-x: auto;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: thin;
  }
  .filter-btn {
    padding: 6px 12px;
    background: var(--border);
    border: 1px solid var(--gold-dark);
    border-radius: 15px;
    color: var(--gold-dim);
    font-size: 0.72em;
    font-family: Georgia, serif;
    font-style: italic;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.3s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold-dark);
    color: var(--gold);
    border-color: var(--gold);
  }
  
  /* Stone grid */
  .stone-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    padding: 15px;
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .stone-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .stone-card:hover {
    border-color: var(--gold-dim);
    background: var(--surface-light);
  }
  .stone-card:active {
    transform: scale(0.97);
  }
  .stone-card.vibrating {
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
    background: var(--surface-light);
  }
  
  .stone-card svg {
    width: 120px;
    height: 160px;
    display: block;
    margin: 0 auto;
  }
  
  .stone-card .stone-name {
    font-size: 0.7em;
    color: var(--gold);
    font-style: italic;
    margin-top: 5px;
    line-height: 1.3;
    height: 1.8em;
    overflow: hidden;
  }
  
  /* IEM driver badge */
  .iem-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    opacity: 0.7;
  }
  
  /* Modal for active stone */
  .stone-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 8, 5, 0.95);
    z-index: 100;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .stone-modal.active {
    display: flex;
  }
  .modal-stone {
    width: 280px;
    height: 360px;
  }
  .modal-stone svg {
    width: 100%;
    height: 100%;
  }
  .modal-info {
    text-align: center;
    margin-top: 20px;
    color: var(--gold);
  }
  .modal-info h2 {
    font-size: 1.2em;
    font-style: italic;
    margin-bottom: 8px;
  }
  .modal-info .freq-display {
    font-family: 'Courier New', monospace;
    font-size: 1.1em;
    color: var(--gold);
    margin: 5px 0;
  }
  .modal-info .specs {
    font-size: 0.8em;
    color: var(--gold-dim);
    margin-top: 8px;
  }
  .modal-info .sensation {
    font-size: 0.85em;
    color: var(--gold-dim);
    font-style: italic;
    max-width: 350px;
    margin: 15px auto;
    line-height: 1.5;
  }
  .modal-close {
    margin-top: 20px;
    padding: 10px 30px;
    background: var(--border);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: 8px;
    cursor: pointer;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.9em;
    transition: all 0.3s;
  }
  .modal-close:hover {
    background: var(--gold-dark);
    border-color: var(--gold);
  }
  
  /* Vibration indicator */
  .vibe-indicator {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    background: var(--surface);
    border: 1px solid var(--gold-dark);
    border-radius: 20px;
    color: var(--gold-dim);
    font-size: 0.72em;
    font-style: italic;
    display: none;
    z-index: 50;
  }
  .vibe-indicator.active {
    display: block;
    border-color: var(--gold);
    color: var(--gold);
  }
  
  /* Audio canvas (hidden) */
  #audio-canvas { display: none; }
  
  /* Instructions */
  .instructions {
    text-align: center;
    padding: 10px 20px;
    font-size: 0.72em;
    color: var(--gold-dim);
    font-style: italic;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="header">
  <h1>STONE VIBRATION TOUCH</h1>
  <p class="subtitle">Touch any stone to feel its Mohs vibration · 160 stones, 27 crystal habits</p>
</div>

<div class="sensory-toggle">

  </div>
  <span class="toggle-status" id="hapticStatus">Off</span>
</div>

<div class="filter-bar" id="filterBar">

  <button class="filter-btn" data-filter="bone_conduction" onclick="filterStones('bone_conduction')">Bone Conduction</button>
  <button class="filter-btn" data-filter="dynamic_driver" onclick="filterStones('dynamic_driver')">Dynamic Driver</button>
  <button class="filter-btn" data-filter="balanced_armature" onclick="filterStones('balanced_armature')">Balanced Armature</button>
  <button class="filter-btn" data-filter="electrostatic" onclick="filterStones('electrostatic')">Electrostatic</button>
</div>

<div class="instructions">
  Tap a stone to hear and feel its frequency. Touch and hold for sustained vibration. Enable Touch Sensory for haptic feedback on mobile devices.
</div>

<div class="stone-grid" id="stoneGrid"></div>

<div class="stone-modal" id="stoneModal" onclick="closeModal(event)">
  <div class="modal-stone" id="modalStone"></div>
  <div class="modal-info" id="modalInfo"></div>
  <button class="modal-close" onclick="closeModalDirect()">Close</button>
</div>

<div class="vibe-indicator" id="vibeIndicator"></div>

    '.stone-body-' + stone.id + ' { transform-origin: 120px 140px; animation: vibrate' + stone.id + ' ' + vibRate.toFixed(3) + 's ease-in-out infinite alternate; animation-play-state: paused; }' +
    '.stone-body-' + stone.id + '.vibrating { animation-play-state: running; }' +
    '@keyframes vibrate' + stone.id + ' { ' +
    '0% { transform: translate(0, 0) rotate(0deg); } ' +
    '25% { transform: translate(' + (vibAmp*0.3).toFixed(1) + 'px, -' + (vibAmp*0.5).toFixed(1) + 'px) rotate(' + (vibAmp*0.1).toFixed(1) + 'deg); } ' +
    '50% { transform: translate(-' + (vibAmp*0.2).toFixed(1) + 'px, ' + (vibAmp*0.3).toFixed(1) + 'px) rotate(-' + (vibAmp*0.1).toFixed(1) + 'deg); } ' +
    '75% { transform: translate(' + (vibAmp*0.4).toFixed(1) + 'px, ' + (vibAmp*0.2).toFixed(1) + 'px) rotate(' + (vibAmp*0.05).toFixed(1) + 'deg); } ' +
    '100% { transform: translate(-' + (vibAmp*0.3).toFixed(1) + 'px, -' + (vibAmp*0.4).toFixed(1) + 'px) rotate(0deg); } }' +
    '</style>' +
    '<g class="stone-body-' + stone.id + '">' +
    bodyHtml +
    '</g>' +
    '<text x="120" y="275" style="font-family:Georgia,serif;font-size:11px;fill:' + s + ';text-anchor:middle;font-style:italic">' + stone.name + '</text>' +
    '<text x="120" y="290" style="font-family:Courier New,monospace;font-size:9px;fill:' + iemColor + ';text-anchor:middle">' + stone.freq.toFixed(1) + ' Hz</text>' +
    '<text x="120" y="303" style="font-family:Courier New,monospace;font-size:8px;fill:' + s + ';text-anchor:middle;opacity:0.6">Mohs ' + stone.mohs + ' · SG ' + stone.sg + '</text>' +
    '</svg>';
}

// ============================================================
// AUDIO ENGINE — Web Audio API tone generation
// ============================================================
let audioCtx = null;
let activeOscillators = {};
let activeHaptic = null;
let hapticEnabled = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playStoneTone(stone, duration = 0) {
  initAudio();
  
  // Stop existing tone
  stopStoneTone();
  
  const freq = stone.freq;
  const now = audioCtx.currentTime;
  const dur = duration > 0 ? duration : 999; // long sustain if no duration
  
  // Main oscillator
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  
  // Volume scaling — lower freqs need more gain, higher freqs need less
  const volScale = freq < 100 ? 0.3 : freq < 500 ? 0.15 : freq < 1000 ? 0.08 : 0.04;
  
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(volScale, now + 0.05); // quick attack
  if (duration > 0) {
    gain.gain.linearRampToValueAtTime(volScale, now + dur - 0.1);
    gain.gain.linearRampToValueAtTime(0, now + dur); // release
  }
  
  // Lowpass filter for warmth
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = Math.max(200, freq * 2);
  filter.Q.value = 1;
  
  // 42Hz drone underneath (the Song)
  const droneOsc = audioCtx.createOscillator();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 42;
  
  const droneGain = audioCtx.createGain();
  droneGain.gain.setValueAtTime(0, now);
  droneGain.gain.linearRampToValueAtTime(0.04, now + 0.1);
  if (duration > 0) {
    droneGain.gain.linearRampToValueAtTime(0.04, now + dur - 0.1);
    droneGain.gain.linearRampToValueAtTime(0, now + dur);
  }
  
  // Sub-harmonic for high frequencies (ground the high tones)
  let subOsc = null, subGain = null;
  if (freq > 800) {
    subOsc = audioCtx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.value = freq / 4;
    subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0, now);
    subGain.gain.linearRampToValueAtTime(volScale * 0.5, now + 0.05);
    if (duration > 0) {
      subGain.gain.linearRampToValueAtTime(volScale * 0.5, now + dur - 0.1);
      subGain.gain.linearRampToValueAtTime(0, now + dur);
    }
  }
  
  // Connect
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  
  droneOsc.connect(droneGain);
  droneGain.connect(audioCtx.destination);
  
  if (subOsc) {
    subOsc.connect(subGain);
    subGain.connect(audioCtx.destination);
  }
  
  // Start
  osc.start(now);
  droneOsc.start(now);
  if (subOsc) subOsc.start(now);
  
  if (duration > 0) {
    osc.stop(now + dur);
    droneOsc.stop(now + dur);
    if (subOsc) subOsc.stop(now + dur);
  }
  
  activeOscillators = {
    osc, gain, droneOsc, droneGain, subOsc, subGain,
    stone: stone,
  };
  
  // Haptic feedback
  if (hapticEnabled) {
    triggerHaptic(stone);
  }
}

function stopStoneTone() {
  if (activeOscillators.osc) {
    const now = audioCtx ? audioCtx.currentTime : 0;
    try {
      if (activeOscillators.gain) {
        activeOscillators.gain.gain.cancelScheduledValues(now);
        activeOscillators.gain.gain.linearRampToValueAtTime(0, now + 0.05);
      }
      if (activeOscillators.droneGain) {
        activeOscillators.droneGain.gain.cancelScheduledValues(now);
        activeOscillators.droneGain.gain.linearRampToValueAtTime(0, now + 0.05);
      }
      if (activeOscillators.subGain) {
        activeOscillators.subGain.gain.cancelScheduledValues(now);
        activeOscillators.subGain.gain.linearRampToValueAtTime(0, now + 0.05);
      }
      activeOscillators.osc.stop(now + 0.06);
      activeOscillators.droneOsc.stop(now + 0.06);
      if (activeOscillators.subOsc) activeOscillators.subOsc.stop(now + 0.06);
    } catch(e) {}
  }
  activeOscillators = {};
  
  // Stop haptic
  if (activeHaptic) {
    clearInterval(activeHaptic);
    activeHaptic = null;
  }
  
  // Remove vibrating class from all stones
  document.querySelectorAll('[class*="stone-body-"]').forEach(el => el.classList.remove('vibrating'));
  document.querySelectorAll('.stone-card').forEach(el => el.classList.remove('vibrating'));
  document.getElementById('vibeIndicator').classList.remove('active');
}

// ============================================================
// HAPTIC FEEDBACK — touch sensory
// ============================================================
function triggerHaptic(stone) {
  if (!hapticEnabled) return;
  
  const freq = stone.freq;
  const iem = stone.iem;
  
  // Different haptic patterns per IEM driver type
  let pattern = [];
  
  if (iem === 'bone_conduction') {
    // Deep, slow, strong pulses
    const interval = Math.max(50, Math.min(500, 1000 / (freq / 10)));
    pattern = [100, 50, 100, 50, 100];
  } else if (iem === 'dynamic_driver') {
    // Medium rhythmic pulses
    const interval = Math.max(30, Math.min(200, 500 / (freq / 20)));
    pattern = [50, 30, 50, 30, 50, 30, 50];
  } else if (iem === 'balanced_armature') {
    // Quick precise pulses
    pattern = [20, 20, 20, 20, 20, 20, 20, 20];
  } else if (iem === 'electrostatic') {
    // Very fast, subtle pulses
    pattern = [10, 10, 10, 10, 10, 10, 10, 10, 10, 10];
  }
  
  // Try navigator.vibrate (Android Chrome)
  if (navigator.vibrate) {
    navigator.vibrate(pattern);
  }
  
  // For iOS/other — use a loop of short vibrations
  if (navigator.vibrate) {
    let idx = 0;
    activeHaptic = setInterval(() => {
      if (idx < pattern.length) {
        navigator.vibrate(pattern[idx]);
        idx++;
      } else {
        idx = 0; // loop while touching
      }
    }, 100);
  }
}

function toggleHaptic() {
  hapticEnabled = !hapticEnabled;
  const toggle = document.getElementById('hapticToggle');
  const status = document.getElementById('hapticStatus');
  
  if (hapticEnabled) {
    toggle.classList.add('active');
    status.textContent = navigator.vibrate ? 'On' : 'Unsupported';
    if (!navigator.vibrate) {
      status.textContent = 'No API';
      hapticEnabled = false;
      toggle.classList.remove('active');
    }
  } else {
    toggle.classList.remove('active');
    status.textContent = 'Off';
    if (navigator.vibrate) navigator.vibrate(0);
  }
}

// ============================================================
// STONE GRID — render all stones
// ============================================================
let currentFilter = 'all';
let renderedStones = [];

function renderStoneGrid() {
  const grid = document.getElementById('stoneGrid');
  grid.innerHTML = '';
  
  const filtered = currentFilter === 'all' 
    ? STONE_DATA 
    : STONE_DATA.filter(s => s.iem === currentFilter);
  
  renderedStones = filtered;
  
  filtered.forEach((stone, idx) => {
    const card = document.createElement('div');
    card.className = 'stone-card';
    card.dataset.stoneId = stone.id;
    card.innerHTML = generateStoneSVG(stone);
    
    // Add IEM badge
    const iemColors = {
      bone_conduction: "#8B0000",
      dynamic_driver: "#DAA520",
      balanced_armature: "#4169E1",
      electrostatic: "#9370DB",
    };
    const badge = document.createElement('div');
    badge.className = 'iem-badge';
    badge.style.background = iemColors[stone.iem] || "#8B7355";
    card.appendChild(badge);
    
    // Touch/click handlers
    let isPressed = false;
    
    const startVibration = (e) => {
      e.preventDefault();
      e.stopPropagation();
      isPressed = true;
      
      // Add vibrating class to stone body
      const stoneBody = card.querySelector('[class*="stone-body-"]');
      if (stoneBody) stoneBody.classList.add('vibrating');
      card.classList.add('vibrating');
      
      // Play tone
      playStoneTone(stone);
      
      // Show indicator
      const indicator = document.getElementById('vibeIndicator');
      indicator.textContent = stone.name + ' · ' + stone.freq.toFixed(1) + ' Hz';
      indicator.classList.add('active');
    };
    
    const stopVibration = (e) => {
      if (isPressed) {
        isPressed = false;
        stopStoneTone();
      }
    };
    
    // Mouse
    card.addEventListener('mousedown', startVibration);
    card.addEventListener('mouseup', stopVibration);
    card.addEventListener('mouseleave', stopVibration);
    
    // Touch
    card.addEventListener('touchstart', startVibration, { passive: false });
    card.addEventListener('touchend', stopVibration, { passive: false });
    card.addEventListener('touchcancel', stopVibration, { passive: false });
    
    grid.appendChild(card);
  });
}

// ============================================================
// FILTERING
// ============================================================
function filterStones(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderStoneGrid();
}

// ============================================================
// MODAL (tap to expand)
// ============================================================
function openModal(stone) {
  const modal = document.getElementById('stoneModal');
  const modalStone = document.getElementById('modalStone');
  const modalInfo = document.getElementById('modalInfo');
  
  modalStone.innerHTML = generateStoneSVG(stone);
  const stoneBody = modalStone.querySelector('[class*="stone-body-"]');
  if (stoneBody) stoneBody.classList.add('vibrating');
  
  const iemNames = {
    bone_conduction: 'Bone Conduction',
    dynamic_driver: 'Dynamic Driver',
    balanced_armature: 'Balanced Armature',
    electrostatic: 'Electrostatic',
  };
  
  modalInfo.innerHTML = 
    '<h2>' + stone.name + '</h2>' +
    '<div class="freq-display">' + stone.freq.toFixed(1) + ' Hz</div>' +
    '<div class="specs">Mohs ' + stone.mohs + ' · SG ' + stone.sg + ' · ' + iemNames[stone.iem] + '</div>' +
    '<div class="specs">Crystal Habit: ' + stone.shape.replace(/_/g, ' ') + '</div>';
  
  modal.classList.add('active');
  playStoneTone(stone);
}

function closeModal(e) {
  if (e.target === document.getElementById('stoneModal')) {
    closeModalDirect();
  }
}

function closeModalDirect() {
  document.getElementById('stoneModal').classList.remove('active');
  stopStoneTone();
}

// ============================================================
// INIT
// ============================================================
renderStoneGrid();

// Stop all on page hide
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopStoneTone();
});

</script>
