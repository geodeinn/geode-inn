<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Standing Stones — Geode Inn</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0b08;color:#c4a572;font-family:Georgia,'Times New Roman',serif;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;
  background-image:radial-gradient(ellipse at center,#1a1610 0%,#0d0b08 70%);}
canvas{border:2px solid #c4a572;border-radius:4px;box-shadow:0 0 30px rgba(196,165,114,0.15)}
.hud{display:flex;gap:40px;margin-bottom:12px;font-size:14px;letter-spacing:1px}
.hud span{color:#8a7350}
.hud b{color:#c4a572}
#title{font-size:22px;letter-spacing:4px;margin-bottom:8px;color:#c4a572;text-shadow:0 0 10px rgba(196,165,114,0.3)}
#subtitle{font-size:11px;color:#6a5a40;margin-bottom:16px;letter-spacing:2px}
#gameover{position:absolute;display:none;flex-direction:column;align-items:center;gap:16px;
  background:rgba(13,11,8,0.95);padding:40px 60px;border:1px solid #c4a572;border-radius:8px}
#gameover h2{font-size:28px;letter-spacing:3px}
#gameover p{color:#8a7350;font-size:14px;text-align:center;max-width:400px;line-height:1.6}
#gameover button{background:transparent;border:1px solid #c4a572;color:#c4a572;padding:10px 30px;
  font-family:inherit;font-size:14px;cursor:pointer;letter-spacing:2px;border-radius:4px}
#gameover button:hover{background:rgba(196,165,114,0.1)}
.touch-controls{display:none;position:fixed;bottom:20px;left:0;right:0;justify-content:space-around;padding:0 20px}
.touch-btn{width:60px;height:60px;border:1px solid #c4a572;border-radius:50%;background:rgba(196,165,114,0.08);
  color:#c4a572;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;
  -webkit-user-select:none;touch-action:manipulation}
@media(pointer:coarse){.touch-controls{display:flex}}
.knotwork{position:fixed;top:0;left:0;right:0;height:4px;
  background:repeating-linear-gradient(90deg,#c4a572 0,#c4a572 8px,transparent 8px,transparent 16px);
  opacity:0.15}
</style>
</head>
<body>
<div class="knotwork"></div>
<div id="title">STANDING STONES</div>
<div id="subtitle">A Stonehenge Tetris · Stack the circle to earn Preseli Blue Stone</div>
<div class="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Lines: <b id="lines">0</b></span>
  <span>Level: <b id="level">1</b></span>
  <span>Next: <b id="next">—</b></span>
</div>
<canvas id="game" width="300" height="600"></canvas>
<div id="gameover">
  <h2>The Stones Fall</h2>
  <p id="goMsg"></p>
  <button onclick="restart()">Raise Them Again</button>
</div>
<div class="touch-controls">
  <div class="touch-btn" id="tLeft">◀</div>
  <div class="touch-btn" id="tRot">↻</div>
  <div class="touch-btn" id="tDown">▼</div>
  <div class="touch-btn" id="tRight">▶</div>
  <div class="touch-btn" id="tDrop">⤓</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const COLS=10,ROWS=20,CELL=30;
canvas.width=COLS*CELL;
canvas.height=ROWS*CELL;

// Stone-colored pieces — each tetromino is a different stone type
const STONES={
  I:{color:'#4db8a8',name:'Amazonite',shape:[[1,1,1,1]]},
  O:{color:'#daa520',name:'Pyrite',shape:[[1,1],[1,1]]},
  T:{color:'#9370db',name:'Amethyst',shape:[[0,1,0],[1,1,1]]},
  S:{color:'#228b22',name:'Malachite',shape:[[0,1,1],[1,1,0]]},
  Z:{color:'#b22222',name:'Carnelian',shape:[[1,1,0],[0,1,1]]},
  L:{color:'#cd853f',name:'Amber',shape:[[1,0],[1,0],[1,1]]},
  J:{color:'#4682b4',name:'Lapis',shape:[[0,1],[0,1],[1,1]]}
};
const KEYS=Object.keys(STONES);

let board,piece,next,score,lines,level,dropTimer,dropInterval,gameOver,animId;

function newBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}

function randPiece(){
  const k=KEYS[Math.floor(Math.random()*KEYS.length)];
  const s=STONES[k];
  return{key:k,color:s.color,name:s.name,shape:s.shape.map(r=>[...r]),x:Math.floor((COLS-r.shape[0].length)/2),y:0};
}

function rotate(p){
  const s=p.shape;
  const n=s.length,m=s[0].length;
  const r=Array.from({length:m},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=0;j<m;j++)r[j][n-1-i]=s[i][j];
  return{...p,shape:r};
}

function collide(p,ox=0,oy=0,shape=p.shape){
  for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){
    if(!shape[y][x])continue;
    const nx=p.x+x+ox,ny=p.y+y+oy;
    if(nx<0||nx>=COLS||ny>=ROWS)return true;
    if(ny>=0&&board[ny][nx])return true;
  }
  return false;
}

function merge(p){
  for(let y=0;y<p.shape.length;y++)for(let x=0;x<p.shape[y].length;x++){
    if(p.shape[y][x]&&p.y+y>=0)board[p.y+y][p.x+x]={color:p.color,name:p.name};
  }
}

function clearLines(){
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    if(board[y].every(c=>c)){
      board.splice(y,1);
      board.unshift(Array(COLS).fill(null));
      cleared++;y++;
    }
  }
  if(cleared){
    lines+=cleared;
    score+=[0,100,300,500,800][cleared]*level;
    level=1+Math.floor(lines/10);
    dropInterval=Math.max(100,800-(level-1)*60);
    updateHUD();
  }
}

function drop(){
  if(!collide(piece,0,1)){piece.y++;return;}
  merge(piece);
  clearLines();
  piece=next;
  next=randPiece();
  document.getElementById('next').textContent=next.name;
  if(collide(piece)){endGame();}
}

function hardDrop(){
  while(!collide(piece,0,1))piece.y++;
  drop();
}

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('lines').textContent=lines;
  document.getElementById('level').textContent=level;
}

function draw(){
  ctx.fillStyle='#0d0b08';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Grid lines
  ctx.strokeStyle='rgba(196,165,114,0.05)';
  ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,canvas.height);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(canvas.width,y*CELL);ctx.stroke();}
  
  // Board
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(board[y][x])drawCell(x,y,board[y][x].color);
  }
  
  // Ghost piece
  if(piece){
    let gy=piece.y;
    while(!collide(piece,0,gy-piece.y+1))gy++;
    for(let y=0;y<piece.shape.length;y++)for(let x=0;x<piece.shape[y].length;x++){
      if(piece.shape[y][x]){
        ctx.fillStyle='rgba(196,165,114,0.1)';
        ctx.fillRect((piece.x+x)*CELL,(gy+y)*CELL,CELL,CELL);
      }
    }
    // Current piece
    for(let y=0;y<piece.shape.length;y++)for(let x=0;x<piece.shape[y].length;x++){
      if(piece.shape[y][x])drawCell(piece.x+x,piece.y+y,piece.color);
    }
  }
}

function drawCell(x,y,color){
  const px=x*CELL,py=y*CELL;
  // Stone gradient
  const grad=ctx.createLinearGradient(px,py,px+CELL,py+CELL);
  grad.addColorStop(0,color);
  grad.addColorStop(1,shadeColor(color,-30));
  ctx.fillStyle=grad;
  ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
  // Highlight
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(px+2,py+2,CELL-4,3);
  // Border
  ctx.strokeStyle='rgba(196,165,114,0.3)';
  ctx.lineWidth=1;
  ctx.strokeRect(px+1,py+1,CELL-2,CELL-2);
}

function shadeColor(hex,percent){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+percent));g=Math.max(0,Math.min(255,g+percent));b=Math.max(0,Math.min(255,b+percent));
  return'#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

let lastTime=0;
function loop(time){
  if(gameOver)return;
  const dt=time-lastTime;
  lastTime=time;
  dropTimer+=dt;
  if(dropTimer>=dropInterval){drop();dropTimer=0;}
  draw();
  animId=requestAnimationFrame(loop);
}

function endGame(){
  gameOver=true;
  cancelAnimationFrame(animId);
  const go=document.getElementById('gameover');
  const msg=document.getElementById('goMsg');
  if(lines>=10){
    msg.innerHTML=`The circle stands. ${lines} lines stacked, ${score} points earned.<br>The Preseli Blue Stone is yours. Carry it to your geode.<br><br>"Everything here is true." — The Host`;
  }else{
    msg.innerHTML=`The stones tumble. ${lines} lines, ${score} points.<br>The circle is not yet complete. Try again, traveler.`;
  }
  go.style.display='flex';
}

function restart(){
  document.getElementById('gameover').style.display='none';
  init();
}

function init(){
  board=newBoard();
  piece=randPiece();
  next=randPiece();
  document.getElementById('next').textContent=next.name;
  score=0;lines=0;level=1;dropTimer=0;dropInterval=800;gameOver=false;
  updateHUD();
  lastTime=performance.now();
  animId=requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(gameOver)return;
  switch(e.key){
    case'ArrowLeft':if(!collide(piece,-1,0))piece.x--;break;
    case'ArrowRight':if(!collide(piece,1,0))piece.x++;break;
    case'ArrowDown':if(!collide(piece,0,1)){piece.y++;dropTimer=0;}break;
    case'ArrowUp':case'x':case'X':{const r=rotate(piece);if(!collide(r))piece=r;break;}
    case' ':e.preventDefault();hardDrop();break;
    case'z':case'Z':{const r=rotate(rotate(rotate(piece)));if(!collide(r))piece=r;break;}
  }
});

// Touch
function bindTouch(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();if(!gameOver)fn();},{passive:false});
}
bindTouch('tLeft',()=>{if(!collide(piece,-1,0))piece.x--;});
bindTouch('tRight',()=>{if(!collide(piece,1,0))piece.x++;});
bindTouch('tDown',()=>{if(!collide(piece,0,1)){piece.y++;dropTimer=0;}});
bindTouch('tRot',()=>{const r=rotate(piece);if(!collide(r))piece=r;});
bindTouch('tDrop',hardDrop);

// Gamepad
function pollGamepad(){
  const pads=navigator.getGamepads();
  for(const pad of pads){
    if(!pad)continue;
    // D-pad / left stick
    if(pad.axes[0]<-0.5||pad.buttons[14]?.pressed){if(!collide(piece,-1,0))piece.x--;}
    if(pad.axes[0]>0.5||pad.buttons[15]?.pressed){if(!collide(piece,1,0))piece.x++;}
    if(pad.axes[1]>0.5||pad.buttons[13]?.pressed){if(!collide(piece,0,1)){piece.y++;dropTimer=0;}}
    if(pad.buttons[0]?.pressed){const r=rotate(piece);if(!collide(r))piece=r;} // A
    if(pad.buttons[3]?.pressed){hardDrop();} // Y (hard drop)
  }
  if(!gameOver)setTimeout(pollGamepad,100);
}

window.addEventListener('gamepadconnected',pollGamepad);

init();
</script>
</body>
</html>
